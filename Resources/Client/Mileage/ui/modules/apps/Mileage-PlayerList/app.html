<div ng-controller="PlayerList" id="PlayerList" class="mileagePlayerList" ng-init="init()" ng-style="{'background-color': 'rgba(0, 0, 0, 0)', 'height': '100%'}">
	<link id="playerlist-style" rel="stylesheet" type="text/css" href="/ui/modules/apps/Mileage-PlayerList/app.css">
	<div id="connection-banner" ng-show="connection.lost">
		<div class="connection-message" ng-bind="connection.message"></div>
		<div class="connection-save" ng-bind="saveText()"></div>
		<div class="connection-actions">
			<button class="buttons" ng-show="connection.saveState == 'failed'" ng-click="retrySave()">Try saving again</button>
			<button class="buttons" ng-click="returnToMenu()">Return to menu</button>
		</div>
	</div>
	<div id="main-container">
		<div id="plist-container">
			<table id="players-table">
				<tr>
					<th class="playerslist-col-1" ng-show="showPlayerIDs">ID</th>
					<th class="playerslist-col-2">
						{{:: 'ui.apps.beammp.playerlist.players' | translate }}
					</th>
					<th  class="playerslist-col-3">
						<button class="buttons direction-buttons" id="leaderboard-button" title="Leaderboard" ng-click="openLeaderboard()">🏆</button>
						<button class="buttons direction-buttons" ng-click="plSwapHorizontal()">🡘</button>
						<button class="buttons direction-buttons" ng-click="plSwapVertical()">🡙</button>
					</th>
				</tr>
				<tr>
					<td>{{:: 'ui.apps.beammp.playerlist.error' | translate }}</td>
				</tr>
			</table>
		</div>
		<button class="buttons" id="show-button" onclick="toggleList()">&lt;</button>
	</div>
	<div id="playerlist-contextmenu" style="display: none;">
		<div id="pl-context-name" class="pl-context-name"></div>
		<button id="pl-context-race">Race…</button>
		<div id="pl-context-race-why" class="pl-context-why" style="display: none;"></div>
		<button id="pl-context-pay">Pay…</button>
		<div id="pl-context-pay-why" class="pl-context-why" style="display: none;"></div>
		<button id="pl-context-request">Request money…</button>
		<div id="pl-context-request-why" class="pl-context-why" style="display: none;"></div>
		<div id="pl-context-form" style="display: none;">
			<div id="pl-context-form-title" class="pl-context-form-title"></div>
			<div id="pl-context-form-info" class="pl-context-info"></div>
			<label id="pl-context-amount-label" for="pl-context-amount"></label>
			<input id="pl-context-amount" type="text" inputmode="numeric" autocomplete="off">
			<div id="pl-context-error" class="pl-context-error"></div>
			<button id="pl-context-send"></button>
			<button id="pl-context-cancel">Cancel</button>
		</div>
	</div>
</div>
