# Runs the whole test suite on every push and every pull request: the Lua tests under
# LuaJIT (the game's Lua) and Lua 5.4, then the two player list page tests under Node.
# Read-only: it uses no secrets and writes nothing back.
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and Lua 5.4
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit lua5.4

      - name: Lua tests under LuaJIT
        run: luajit tests/run.lua

      - name: Lua tests under Lua 5.4
        run: lua5.4 tests/run.lua

      - name: Player list page tests
        run: |
          node tests/player_list_test.js
          node tests/prompts_app_test.js

      # A release branch is named for its version (v0.4.1), and everything that carries
      # the version must say the same; tools/set_version.py writes them all.
      - name: Version matches a release branch's name
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TITLE="$BRANCH" python3 tools/release_check.py
          else
            echo "not a release branch, nothing to check"
          fi
